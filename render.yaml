services:
  - type: web
    name: journals-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://664259022-7153403-final-3.vercel.app
      - key: NODE_ENV
        value: production
